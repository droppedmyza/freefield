[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freefield"
version = "0.1.0"
description = "Open, Higgsfield-style viral presets on Comfy: one photo in, one shareable clip out."
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["comfy-sdk>=0.5,<0.6", "aiohttp>=3.11", "pillow", "numpy", "opencv-python-headless"]

[project.optional-dependencies]
checks = ["onnxruntime", "open_clip_torch", "transformers"]
local = ["comfy-api-proxy>=0.1.6"]
dev = ["pytest>=8"]

[project.scripts]
freefield = "freefield.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["freefield*"]

[tool.setuptools.package-data]
freefield = ["node_schemas.json", "graphs/*.json", "fonts/*", "web/*", "presets/**/*"]

[tool.setuptools.exclude-package-data]
freefield = ["presets/_drafts/**"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["evidence", "promo", ".runtime", "outputs", "runs"]

[tool.ruff.lint]
select = ["F", "I"]
